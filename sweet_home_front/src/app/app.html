<div>
  <app-header/>
  <app-hero/>
  <app-catalog/>
  <app-about-us/>
  <app-reviews/>
  <app-footer/>
</div>
<div class="fixed top-4 right-4 z-50 flex flex-col gap-2">
  @for(notification of notificationsService.toasts(); track notification.id){
    <app-toast
      [notification]="notification"
      (close)="notificationsService.removeToast(notification.id)"
    />
  }
</div>

@if(authService.showLoginModal()){
  <app-auth-modal
    (close)="this.closeModal()"
  />
}

@if (!authService.isAdmin()) {
  <div class="fixed bottom-6 right-6 z-50">
    <!-- Aquí irá el botón + con su menú desplegable (Paso 4) -->
    <button class="w-14 h-14 bg-primary-dark text-bg-light rounded-full shadow-xl hover:scale-105 hover:bg-accent transition-all duration-300 flex items-center justify-center cursor-pointer">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
      </svg>
    </button>
  </div>
}
