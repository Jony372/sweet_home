<div>
  <app-header/>
  <app-hero/>
  <app-catalog/>
  <app-about-us/>
  <app-reviews/>
  <app-footer/>
</div>
<div class="fixed top-4 right-4 z-50 flex flex-col gap-2">
  @for(notification of notificationsService.toasts(); track notification.id){
    <app-toast
      [notification]="notification"
      (close)="notificationsService.removeToast(notification.id)"
    />
  }
</div>

@if(authService.showLoginModal()){
  <app-auth-modal
    (close)="this.closeModal()"
  />
}

@if (authService.isAdmin()) {

  @if(showHouseModal()){
    <app-create-house
      (close)="closeHouseModal()"
    />
  }

  @if(showCategoryModal()){
    <app-create-category
      (close)="closeCategoryModal()"
    />
  }

  <div class="fixed bottom-6 left-6 z-50 flex flex-col items-start gap-3">

    <!-- Menú Desplegable -->
    <div class="flex flex-col gap-3 transition-all duration-300 origin-bottom-left"
         [ngClass]="openFabMenu() ? 'opacity-100 scale-100 visible' : 'opacity-0 scale-50 invisible'">

      <button (click)="openHouseModal(); toggleFabMenu()" class="flex items-center gap-2 bg-bg-light text-bg-dark px-4 py-2 rounded-full shadow-lg hover:bg-gray-200 transition-colors cursor-pointer border border-gray-200">
        <svg class="w-5 h-5 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        <span class="text-sm font-bold">Nueva Casa</span>
      </button>

      <button (click)="openCategoryModal(); toggleFabMenu()" class="flex items-center gap-2 bg-bg-light text-bg-dark px-4 py-2 rounded-full shadow-lg hover:bg-gray-200 transition-colors cursor-pointer border border-gray-200">
        <svg class="w-5 h-5 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
        <span class="text-sm font-bold">Nueva Categoría</span>
      </button>

    </div>

    <!-- Botón Principal (+) -->
    <button (click)="toggleFabMenu()" class="w-14 h-14 bg-primary-dark text-bg-light rounded-full shadow-xl hover:scale-105 hover:bg-accent transition-all duration-300 flex items-center justify-center cursor-pointer">
      <svg class="w-8 h-8 transition-transform duration-300" [ngClass]="{'rotate-45': openFabMenu()}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
      </svg>
    </button>
  </div>
}
