<!-- Backdrop semitransparente -->
<div class="fixed inset-0 z-40 flex items-center justify-center bg-black/60 backdrop-blur-sm transition-opacity px-4">

  <!-- Contenedor del Modal -->
  <div class="bg-bg-light w-full max-w-md rounded-2xl shadow-2xl overflow-hidden relative animate-fade-in-up">

    <!-- Botón de cerrar superior -->
    <button (click)="closeModal()" class="absolute top-4 right-4 text-bg-dark hover:text-accent focus:outline-none transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>

    <div class="px-8 py-10">
      <h2 class="text-3xl font-bold text-center text-primary-dark mb-8">
        {{ isLoginMode() ? 'Iniciar Sesión' : 'Crear Cuenta' }}
      </h2>

      <form (submit)="onSubmit($event)" class="space-y-5">
        <!-- Campo Nombre (Solo visible en Registro) -->
        @if (!isLoginMode()) {
          <div>
            <label class="block text-sm font-semibold text-bg-dark mb-1">Nombre</label>
            <input type="text" placeholder="Ej. Juan Pérez" [formField]="authForm.name"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-accent outline-none bg-white text-gray-900 transition-all">
          </div>
          <div>
            <label class="block text-sm font-semibold text-bg-dark mb-1">Apellido</label>
            <input type="text" placeholder="Ej. Pérez" [formField]="authForm.lastName"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-accent outline-none bg-white text-gray-900 transition-all">
          </div>
          <!-- <div>
            <label class="block text-sm font-semibold text-bg-dark mb-1">Correo electrónico</label>
            <input type="email" placeholder="correo@ejemplo.com"  [formField]="authForm.email"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-accent outline-none bg-white text-gray-900 transition-all">
          </div> -->
        }
        <div>
          <label class="block text-sm font-semibold text-bg-dark mb-1">Nombre de usuario</label>
          <input type="text" placeholder="Ej. juanperez" [formField]="authForm.username"
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-accent outline-none bg-white text-gray-900 transition-all">
        </div>

        <div>
          <label class="block text-sm font-semibold text-bg-dark mb-1">Contraseña</label>
          <input type="password" placeholder="••••••••" [formField]="authForm.password"
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-accent outline-none bg-white text-gray-900 transition-all">
        </div>
        @if(isLoginMode()){

          <div class="flex items-center mt-2">
            <label class="text-sm text-gray-600">Recordarme</label>
            <input type="checkbox" [formField]="authForm.rememberMe" class="ml-2">
          </div>
        }

        <!-- Botón de Acción -->
        <button type="submit" class="w-full bg-primary-dark text-bg-light py-3 rounded-lg font-bold text-lg hover:bg-accent hover:-translate-y-1 hover:shadow-lg transition-all duration-300 mt-4 cursor-pointer">
          {{ isLoginMode() ? 'Entrar' : 'Registrarme' }}
        </button>
      </form>

      <!-- Toggle entre modos -->
      <div class="mt-6 text-center">
        <p class="text-sm text-gray-600">
          {{ isLoginMode() ? '¿No tienes cuenta?' : '¿Ya tienes cuenta?' }}
          <button type="button" (click)="toggleMode()" class="text-primary-dark font-bold hover:text-accent underline transition-colors cursor-pointer ml-1">
            {{ isLoginMode() ? 'Regístrate' : 'Inicia Sesión' }}
          </button>
        </p>
      </div>
    </div>
  </div>
</div>
