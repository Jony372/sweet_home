<div class="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm px-4">
  <div class="bg-bg-light w-full max-w-md rounded-2xl shadow-2xl overflow-hidden relative animate-fade-in-up">

    <button (click)="closeModal()" class="absolute top-4 right-4 text-bg-dark hover:text-accent transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>

    <div class="px-8 py-8">
      <h2 class="text-2xl font-bold text-primary-dark mb-6">Crear Categoría</h2>

      <form (submit)="onSubmit($event)" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-bg-dark mb-1">Nombre de la categoría</label>
          <input type="text" placeholder="Ej. Residencial" [formField]="categoryForm.name"
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent outline-none bg-white text-gray-900">
        </div>

        <div>
          <label class="block text-sm font-semibold text-bg-dark mb-1">Descripción</label>
          <textarea rows="3" placeholder="Breve descripción..." [formField]="categoryForm.description"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent outline-none bg-white text-gray-900 resize-none"></textarea>
        </div>

        <button type="submit" class="w-full bg-primary-dark text-bg-light py-3 rounded-lg font-bold hover:bg-accent transition-colors mt-4 cursor-pointer">
          Guardar Categoría
        </button>
      </form>
    </div>
  </div>
</div>
