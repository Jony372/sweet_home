<article class="flex flex-col gap-4 justify-center items-center p-4 rounded-lg shadow-md w-fit h-full border-2 border-bg-dark">
  <div>
    <img [src]="rating().houseImgUrl" alt="House Image" class="w-48 md:w-64 aspect-square object-cover rounded-full">
  </div>
  <div class="flex flex-col grow w-full">
    <h3 class="text-lg font-semibold text-primary-dark text-center">{{ rating().houseName }}</h3>
    <div class="pt-2">
      <p class="text-bg-dark line-clamp-3">{{ rating().comment }}</p>
      <div class="flex justify-between items-center">
        <p class="text-sm ">Por: {{ rating().username }}</p>
        <p class="text-sm flex items-center text-primary-dark gap-1">
          <span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 " viewBox="0 0 24 24" fill="currentColor"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M8.243 7.34l-6.38 .925l-.113 .023a1 1 0 0 0 -.44 1.684l4.622 4.499l-1.09 6.355l-.013 .11a1 1 0 0 0 1.464 .944l5.706 -3l5.693 3l.1 .046a1 1 0 0 0 1.352 -1.1l-1.091 -6.355l4.624 -4.5l.078 -.085a1 1 0 0 0 -.633 -1.62l-6.38 -.926l-2.852 -5.78a1 1 0 0 0 -1.794 0l-2.853 5.78z" /></svg>
          </span>
          {{ rating().rating }}
        </p>
      </div>
    </div>
  </div>
</article>
