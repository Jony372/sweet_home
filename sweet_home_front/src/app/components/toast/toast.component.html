<div class="flex z-50 items-center w-full max-w-sm p-4 rounded-r-lg shadow-xl bg-bg-light text-bg-dark border-l-4 transition-all duration-300 ease-in-out hover:scale-[1.02]"
     [ngClass]="{
       'border-green-500': notification().type === 'success',
       'border-red-500': notification().type === 'error',
       'border-accent': notification().type === 'info',
       'border-yellow-500': notification().type === 'warning'
     }">

  <!-- Icono dinámico según el tipo -->
  <div class="inline-flex items-center justify-center shrink-0 w-8 h-8 rounded-full"
       [ngClass]="{
         'text-green-600 bg-green-200': notification().type === 'success',
         'text-red-600 bg-red-200': notification().type === 'error',
         'text-bg-light bg-accent': notification().type === 'info',
         'text-yellow-700 bg-yellow-200': notification().type === 'warning'
       }">
    @switch(notification().type) {
      @case('success') {
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
      }
      @case('error') {
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      }
      @case('info') {
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      }
      @case('warning') {
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
      }
    }
  </div>

  <!-- Mensaje del Toast -->
  <div class="ml-4 text-sm font-semibold text-bg-dark leading-tight flex-1">
    {{ notification().message }}
  </div>

  <!-- Botón de cerrar (Asegúrate de ajustar el método remove de tu servicio) -->
  <button type="button" (click)="closeToast()" class="ml-auto -mx-1.5 -my-1.5 p-1.5 text-bg-dark hover:bg-gray-300 rounded-lg focus:ring-2 focus:ring-accent inline-flex items-center justify-center h-8 w-8 transition-colors cursor-pointer">
    <svg class="w-4 h-4" aria-hidden="true" fill="none" viewBox="0 0 14 14">
      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
    </svg>
  </button>
</div>
