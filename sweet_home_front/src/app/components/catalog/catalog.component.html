<section id="catalog" class="px-4 py-8 w-full">
  <div class="max-w-7xl mx-auto container flex flex-col gap-4 text-center">
    <h2 class="text-3xl font-bold text-accent pb-4">Catalogo de Propiedades</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      @for (house of catalogService.catalog(); track $index) {
        <app-card [houseInfo]="house" />
      }
    </div>
    @if(catalogService.canLoadMore()){
      <button (click)="loadMore()" class="bg-accent text-bg-light px-4 py-2 rounded-full w-max mx-auto hover:bg-accent-dark transition-colors">
        Cargar más
      </button>
    }
  </div>
</section>
